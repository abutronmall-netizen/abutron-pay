<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abutron Step 26A Admin</title>
<style>
:root{color-scheme:dark;background:#07090c;color:#f5f7fa;font-family:Inter,Segoe UI,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.brand{font-size:22px;font-weight:800}.gold{color:#d8b25c}.muted{color:#9aa4b2}
.card{background:#10151c;border:1px solid #222c38;border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.metric{font-size:28px;font-weight:800;margin-top:4px}.row{display:flex;gap:10px;flex-wrap:wrap}
input,select,textarea,button{background:#0a0f14;color:#fff;border:1px solid #2a3442;border-radius:10px;padding:11px}
input,textarea{width:100%}button{cursor:pointer;background:#d8b25c;color:#0b0d10;font-weight:800}
button.alt{background:#18212c;color:#fff}.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #222c38;text-align:left}
.badge{padding:4px 8px;border-radius:999px;background:#17212c;font-size:12px}
pre{white-space:pre-wrap;overflow:auto}.danger{color:#ff8c8c}.ok{color:#79d88f}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="brand"><span class="gold">ABUTRON</span> STEP 26A ADMIN</div>
    <div class="muted">Customer · Mobile · Support · License Visibility</div>
  </div>
  <button id="logout" class="alt hidden">Logout</button>
</header>

<section id="loginCard" class="card">
  <h2>Administrator Login</h2>
  <div class="grid">
    <label>Email<input id="email" type="email" autocomplete="username"></label>
    <label>Password<input id="password" type="password" autocomplete="current-password"></label>
  </div>
  <p><button id="login">Login</button></p>
  <div id="loginMsg" class="muted"></div>
</section>

<section id="app" class="hidden">
  <div class="grid" id="metrics"></div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h2>Customers</h2>
      <button class="alt" id="refresh">Refresh</button>
    </div>
    <div style="overflow:auto">
      <table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Active</th><th>Open</th></tr></thead>
      <tbody id="users"></tbody></table>
    </div>
  </div>

  <div class="card">
    <h2>Support Tickets</h2>
    <div style="overflow:auto">
      <table><thead><tr><th>ID</th><th>User</th><th>Priority</th><th>Status</th><th>Subject</th><th>Action</th></tr></thead>
      <tbody id="tickets"></tbody></table>
    </div>
  </div>

  <div class="card hidden" id="detailCard">
    <h2>Customer Detail</h2>
    <pre id="detail"></pre>
  </div>
</section>
</div>

<script>
const state={token:""};
const $=id=>document.getElementById(id);
async function api(path,opts={}){
  const headers={"Content-Type":"application/json",...(opts.headers||{})};
  if(state.token) headers.Authorization=`Bearer ${state.token}`;
  const r=await fetch(path,{...opts,headers});
  const text=await r.text();
  let data={}; try{data=text?JSON.parse(text):{}}catch{data={raw:text}}
  if(!r.ok) throw new Error(data.detail||data.raw||`HTTP ${r.status}`);
  return data;
}
async function login(){
  $("loginMsg").textContent="Signing in...";
  try{
    const x=await api("/v1/auth/login",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("password").value})});
    if(!["admin","superadmin"].includes(x.role)) throw new Error("Administrator role required");
    state.token=x.access_token;
    $("loginCard").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");
    await load();
  }catch(e){$("loginMsg").textContent=e.message}
}
function metric(label,value){return `<div class="card"><div class="muted">${label}</div><div class="metric">${value}</div></div>`}
async function load(){
  const [base,s26,users,tickets]=await Promise.all([
    api("/v1/admin/summary"),api("/v1/admin/step26a/summary"),api("/v1/admin/users?limit=500"),api("/v1/admin/support/tickets?limit=500")
  ]);
  $("metrics").innerHTML=[
    metric("Customers",base.users),metric("Trading Accounts",base.accounts),metric("Active Licenses",base.active_licenses),
    metric("Trades",base.trades),metric("Active Devices",s26.active_devices),metric("Open Support",s26.open_support_tickets),
    metric("Execution",s26.execution_enabled?"ON":"OFF"),metric("Mobile Mode",s26.mobile_trading_mode)
  ].join("");
  $("users").innerHTML=users.map(u=>`<tr><td>${u.id}</td><td>${esc(u.full_name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone||"")}</td><td>${esc(u.role)}</td><td>${u.active}</td><td><button class="alt" onclick="detail(${u.id})">View</button></td></tr>`).join("");
  $("tickets").innerHTML=tickets.map(t=>`<tr><td>${t.id}</td><td>${esc(t.user_email)}</td><td><span class="badge">${esc(t.priority)}</span></td><td>${esc(t.status)}</td><td>${esc(t.subject)}</td><td><button class="alt" onclick="resolveTicket(${t.id})">Resolve</button></td></tr>`).join("");
}
async function detail(id){
  const x=await api(`/v1/admin/customers/${id}`);
  $("detail").textContent=JSON.stringify(x,null,2);$("detailCard").classList.remove("hidden");
}
async function resolveTicket(id){
  const note=prompt("Resolution / admin note:","Resolved by Abutron support");
  if(note===null)return;
  await api(`/v1/admin/support/tickets/${id}`,{method:"PUT",body:JSON.stringify({status:"resolved",admin_note:note})});
  await load();
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
$("login").onclick=login;$("refresh").onclick=load;$("logout").onclick=()=>location.reload();
</script>
</body>
</html>
