<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abutron Trading Platform v4.0</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;background:#080c12;color:#e8eef6;margin:0}
header{padding:18px 26px;background:#101722;border-bottom:1px solid #263241;display:flex;justify-content:space-between;align-items:center}
main{padding:22px;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#101722;border:1px solid #263241;border-radius:12px;padding:16px;margin-bottom:16px}
.metric{font-size:28px;font-weight:700}.muted{color:#92a4b8}input,button,select{padding:10px;border-radius:8px;border:1px solid #334155;background:#090e15;color:#e8eef6}button{cursor:pointer;font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #263241;text-align:left;font-size:13px}.ok{color:#72e6a0}.bad{color:#ff8c8c}.warn{color:#ffd166}pre{white-space:pre-wrap;word-break:break-word}
</style></head>
<body><header><div><b>ABUTRON TRADING PLATFORM</b><div class="muted">v4.0 — Kronos + Fusion + Institutional</div></div><div id="session" class="muted">Not signed in</div></header>
<main>
<div class="card"><div class="toolbar"><input id="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Admin Login</button><input id="internal" type="password" placeholder="Internal API token"><button onclick="refreshAll()">Refresh</button></div></div>
<div class="grid"><div class="card"><div class="muted">Users</div><div id="usersCount" class="metric">—</div></div><div class="card"><div class="muted">Trading accounts</div><div id="accountsCount" class="metric">—</div></div><div class="card"><div class="muted">Active licenses</div><div id="licensesCount" class="metric">—</div></div><div class="card"><div class="muted">Trades</div><div id="tradesCount" class="metric">—</div></div><div class="card"><div class="muted">Execution</div><div id="execution" class="metric">—</div></div></div>
<div class="card"><h3>Platform Health</h3><pre id="health">Loading…</pre></div>
<div class="card"><h3>Recent Customers</h3><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Active</th><th>Created</th></tr></thead><tbody id="users"></tbody></table></div></div>
<div class="card"><h3>Recent Trading Decisions</h3><div style="overflow:auto"><table><thead><tr><th>Time</th><th>Symbol</th><th>Mode</th><th>Direction</th><th>Confidence</th><th>Plan</th><th>Reason</th></tr></thead><tbody id="decisions"></tbody></table></div></div>
</main>
<script>
let jwtToken=localStorage.getItem('abutronAdminJwt')||'';
async function login(){const email=document.getElementById('email').value,password=document.getElementById('password').value;const r=await fetch('/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(!r.ok){alert('Login failed');return}const x=await r.json();jwtToken=x.access_token;localStorage.setItem('abutronAdminJwt',jwtToken);document.getElementById('session').textContent='Admin session active';refreshAll()}
async function getJSON(url,headers={}){const r=await fetch(url,{headers});if(!r.ok)throw new Error(await r.text());return r.json()}
async function refreshAll(){
 try{document.getElementById('health').textContent=JSON.stringify(await getJSON('/health'),null,2)}catch(e){document.getElementById('health').textContent=String(e)}
 if(jwtToken){try{const h={Authorization:'Bearer '+jwtToken};const s=await getJSON('/v1/admin/summary',h);usersCount.textContent=s.users;accountsCount.textContent=s.accounts;licensesCount.textContent=s.active_licenses;tradesCount.textContent=s.trades;execution.textContent=s.execution_enabled?'LIVE':'SAFE';execution.className='metric '+(s.execution_enabled?'warn':'ok');const us=await getJSON('/v1/admin/users?limit=100',h);users.innerHTML='';us.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${x.id}</td><td>${x.full_name}</td><td>${x.email}</td><td>${x.phone||''}</td><td>${x.role}</td><td>${x.active}</td><td>${new Date(x.created_ts*1000).toLocaleString()}</td>`;users.appendChild(tr)})}catch(e){console.error(e)}}
 const internal=document.getElementById('internal').value;if(internal){try{const ds=await getJSON('/v1/decisions?limit=100',{Authorization:'Bearer '+internal});decisions.innerHTML='';ds.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${new Date(x.created_ts*1000).toLocaleString()}</td><td>${x.symbol}</td><td>${x.mode}</td><td>${x.direction}</td><td>${Number(x.confidence).toFixed(1)}</td><td class="${x.approved?'ok':'bad'}">${x.approved}</td><td>${x.reason}</td>`;decisions.appendChild(tr)})}catch(e){console.error(e)}}
}
refreshAll();
</script></body></html>
