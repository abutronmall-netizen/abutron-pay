[project]
name="abutron-jarvis"
version="1.0.0"
requires-python=">=3.11"
dependencies=["pydantic-ai>=1,<2","pydantic>=2.8,<3","pydantic-settings>=2.4,<3","fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","httpx>=0.27,<1","psutil>=6,<8","PyYAML>=6,<7","prometheus-client>=0.20,<1"]
[project.optional-dependencies]
dev=["pytest>=8,<10","pytest-asyncio>=0.23,<2","ruff>=0.8,<1","mypy>=1.11,<2"]
openhands=["openhands-sdk>=1"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "data*", "logs*", "config*", "hermes*", "openhands*", "observability*", "scripts*"]
